<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — DIGItal Duniya</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="auth-page">
    <div class="auth-card">
      <a href="index.html" class="auth-logo" style="text-decoration:none;">
        <span style="color:var(--text-primary);">DIGItal</span><span style="color:var(--accent);">Duniya</span>
      </a>
      
      <h2 class="auth-title">Welcome Back</h2>
      <p class="auth-subtitle">Log in to manage your cart, wishlist and track orders.</p>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input type="email" class="form-input" id="login-email" placeholder="name@example.com" required>
        </div>

        <div class="form-group" style="position:relative;">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" class="form-input" id="login-password" placeholder="••••••••" required>
          <span class="password-toggle" id="pass-toggle" title="Toggle password visibility">👁️</span>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
          <div class="form-check">
            <input type="checkbox" id="remember-me">
            <label for="remember-me">Remember me</label>
          </div>
          <a href="#" style="font-size:0.82rem; color:var(--accent); font-weight:600;" onclick="alert('Password reset link has been simulated.');">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width:100%; justify-content:center;">Log In</button>
      </form>

      <div class="auth-switch">
        Don't have an account? <a href="signup.html">Sign Up</a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module">
    import api from './js/api.js';
    import { setCachedUser } from './js/auth.js';
    import { showToast } from './js/products.js';

    document.addEventListener('DOMContentLoaded', () => {
      // Toggle password visibility
      const toggleBtn = document.getElementById('pass-toggle');
      const passField = document.getElementById('login-password');
      toggleBtn?.addEventListener('click', () => {
        const type = passField.type === 'password' ? 'text' : 'password';
        passField.type = type;
        toggleBtn.textContent = type === 'password' ? '👁️' : '🙈';
      });

      // Submit Form
      document.getElementById('login-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;

        const submitBtn = e.target.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Logging in...';

        try {
          const res = await api.auth.login({ email, password });
          setCachedUser(res.data);
          showToast('Login successful! Welcome back 🎉', 'success');
          
          setTimeout(() => {
            if (res.data.role === 'admin') {
              window.location.href = 'admin/dashboard.html';
            } else {
              window.location.href = 'index.html';
            }
          }, 1000);
        } catch (err) {
          showToast(err.message || 'Login failed. Please check credentials.', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Log In';
        }
      });
    });
  </script>
</body>
</html>
