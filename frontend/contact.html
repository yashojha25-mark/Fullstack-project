<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us — DIGItal Duniya</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar" id="main-navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="nav-logo">
        <span>DIGItal</span><span>Duniya</span>
      </a>

      <button class="hamburger" id="nav-toggle" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <ul class="nav-links" id="nav-menu">
        <li><a href="index.html" class="nav-link" data-i18n="home">Home</a></li>
        <li><a href="products.html" class="nav-link" data-i18n="products">Products</a></li>
        <li><a href="about.html" class="nav-link" data-i18n="about">About</a></li>
        <li><a href="contact.html" class="nav-link active" data-i18n="contact">Contact</a></li>
        <li><a href="feedback.html" class="nav-link" data-i18n="feedback">Feedback</a></li>
      </ul>

      <div class="nav-search">
        <span class="search-icon">🔍</span>
        <input type="text" placeholder="Search products..." data-search-input data-i18n="search">
        <div class="suggestion-box" data-search-suggestions style="position: absolute; width: 100%; top: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); z-index: 100;"></div>
      </div>

      <div class="nav-actions">
        <select class="btn btn-ghost btn-sm" id="lang-selector" data-lang-select>
          <option value="en">EN</option>
          <option value="hi">हिन्दी</option>
        </select>
        <button class="nav-icon-btn" id="theme-toggle" data-theme-icon>🌙</button>
        <a href="login.html" class="btn btn-outline btn-sm" data-auth="guest" data-i18n="login">Login</a>
        <a href="signup.html" class="btn btn-primary btn-sm" data-auth="guest" data-i18n="signup">Sign Up</a>
        <a href="wishlist.html" class="nav-icon-btn hidden" data-auth="user">❤️</a>
        <a href="cart.html" class="nav-icon-btn hidden" data-auth="user">
          🛒<span class="nav-badge" data-cart-count style="display: none;">0</span>
        </a>
        <a href="profile.html" class="nav-link hidden" data-auth="user"><span data-user-name>User</span></a>
        <a href="orders.html" class="nav-link hidden" data-auth="user" data-i18n="orders">Orders</a>
        <a href="#" class="btn btn-ghost btn-sm hidden" id="logout-btn" data-auth="user" data-i18n="logout">Logout</a>
        <a href="admin/dashboard.html" class="btn btn-teal btn-sm hidden" data-auth="admin" data-i18n="adminDashboard">Dashboard</a>
      </div>
    </div>
  </nav>

  <!-- Page Content -->
  <main class="container section">
    
    <div style="max-width:600px; margin:0 auto;">
      <h1 class="section-title" style="text-align:center;" data-i18n="contact">Contact Support</h1>
      <p class="section-subtitle" style="text-align:center;">Have a question or request? Drop us a line below.</p>

      <div style="background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:32px; margin-top:24px;">
        <form id="contact-form">
          <div class="form-group">
            <label class="form-label" for="contact-name">Your Name</label>
            <input type="text" class="form-input" id="contact-name" placeholder="John Doe" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="contact-email">Email Address</label>
            <input type="email" class="form-input" id="contact-email" placeholder="name@example.com" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="contact-subject">Subject</label>
            <input type="text" class="form-input" id="contact-subject" placeholder="e.g. Order Tracking Inquiry" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="contact-message">Message Details</label>
            <textarea class="form-input" id="contact-message" rows="5" placeholder="Write details of your query..." required></textarea>
          </div>

          <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Send Message</button>
        </form>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer>
    <div class="container footer-inner">
      <div class="footer-bottom" style="border:none; padding:0;">
        <p>&copy; 2026 DIGItal Duniya. All rights reserved.</p>
        <p>Real-time Mongo tracking feedback.</p>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script type="module">
    import api from './js/api.js';
    import { updateNavAuth, logout } from './js/auth.js';
    import { toggleTheme } from './js/theme.js';
    import { setLang } from './js/language.js';
    import { showToast, updateCartBadge } from './js/products.js';
    import './js/search.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const user = await updateNavAuth();
      await updateCartBadge();

      // Prepopulate email and name if logged in
      if (user) {
        document.getElementById('contact-name').value = user.name || '';
        document.getElementById('contact-email').value = user.email || '';
      }

      document.getElementById('theme-toggle')?.addEventListener('click', toggleTheme);
      document.getElementById('lang-selector')?.addEventListener('change', (e) => {
        setLang(e.target.value);
      });

      const navToggle = document.getElementById('nav-toggle');
      const navMenu = document.getElementById('nav-menu');
      navToggle?.addEventListener('click', () => {
        navMenu?.classList.toggle('open');
      });

      document.getElementById('logout-btn')?.addEventListener('click', async (e) => {
        e.preventDefault();
        await logout();
      });

      // Submit Inquiry
      document.getElementById('contact-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();

        const name = document.getElementById('contact-name').value.trim();
        const email = document.getElementById('contact-email').value.trim();
        const subject = document.getElementById('contact-subject').value.trim();
        const message = document.getElementById('contact-message').value.trim();

        const submitBtn = e.target.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending message...';

        try {
          await api.contact.submit({ name, email, subject, message });
          showToast('Inquiry sent successfully! Admin will respond soon.', 'success');
          e.target.reset();
        } catch (err) {
          showToast(err.message || 'Failed to send inquiry.', 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Send Message';
        }
      });
    });
  </script>
</body>
</html>
