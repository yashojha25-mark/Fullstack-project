<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile — DIGItal Duniya</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar" id="main-navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="nav-logo">
        <span>DIGItal</span><span>Duniya</span>
      </a>

      <button class="hamburger" id="nav-toggle" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <ul class="nav-links" id="nav-menu">
        <li><a href="index.html" class="nav-link" data-i18n="home">Home</a></li>
        <li><a href="products.html" class="nav-link" data-i18n="products">Products</a></li>
        <li><a href="about.html" class="nav-link" data-i18n="about">About</a></li>
        <li><a href="contact.html" class="nav-link" data-i18n="contact">Contact</a></li>
        <li><a href="feedback.html" class="nav-link" data-i18n="feedback">Feedback</a></li>
      </ul>

      <div class="nav-search">
        <span class="search-icon">🔍</span>
        <input type="text" placeholder="Search products..." data-search-input data-i18n="search">
        <div class="suggestion-box" data-search-suggestions style="position: absolute; width: 100%; top: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); z-index: 100;"></div>
      </div>

      <div class="nav-actions">
        <select class="btn btn-ghost btn-sm" id="lang-selector" data-lang-select>
          <option value="en">EN</option>
          <option value="hi">हिन्दी</option>
        </select>
        <button class="nav-icon-btn" id="theme-toggle" data-theme-icon>🌙</button>
        <a href="login.html" class="btn btn-outline btn-sm" data-auth="guest" data-i18n="login">Login</a>
        <a href="signup.html" class="btn btn-primary btn-sm" data-auth="guest" data-i18n="signup">Sign Up</a>
        <a href="wishlist.html" class="nav-icon-btn hidden" data-auth="user">❤️</a>
        <a href="cart.html" class="nav-icon-btn hidden" data-auth="user">
          🛒<span class="nav-badge" data-cart-count style="display: none;">0</span>
        </a>
        <a href="profile.html" class="nav-link active hidden" data-auth="user"><span data-user-name>User</span></a>
        <a href="orders.html" class="nav-link hidden" data-auth="user" data-i18n="orders">Orders</a>
        <a href="#" class="btn btn-ghost btn-sm hidden" id="logout-btn" data-auth="user" data-i18n="logout">Logout</a>
        <a href="admin/dashboard.html" class="btn btn-teal btn-sm hidden" data-auth="admin" data-i18n="adminDashboard">Dashboard</a>
      </div>
    </div>
  </nav>

  <!-- Breadcrumb -->
  <div class="container">
    <div class="breadcrumb">
      <a href="index.html">Home</a>
      <span class="sep">&rsaquo;</span>
      <span class="current" data-i18n="profile">Profile</span>
    </div>
  </div>

  <!-- Page Content -->
  <main class="container section" style="padding-top: 16px;">
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start;">
      
      <!-- Profile Information Panel -->
      <div style="background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:32px;">
        <h3 style="font-weight:700; margin-bottom:24px;">Personal Information</h3>
        
        <form id="profile-form">
          <div class="form-group">
            <label class="form-label" for="profile-email">Email Address (Read-only)</label>
            <input type="email" class="form-input" id="profile-email" style="background:var(--surface-2); color:var(--text-muted);" readonly>
          </div>
          <div class="form-group">
            <label class="form-label" for="profile-name">Full Name</label>
            <input type="text" class="form-input" id="profile-name" required placeholder="Your full name">
          </div>
          <div class="form-group">
            <label class="form-label" for="profile-phone">Phone Number</label>
            <input type="tel" class="form-input" id="profile-phone" placeholder="10 digit phone number" pattern="[0-9]{10}">
          </div>

          <h4 style="font-weight:600; margin-top:24px; margin-bottom:12px; font-size:0.95rem; border-bottom:1px solid var(--border); padding-bottom:6px;">Default Address</h4>
          
          <div class="form-group">
            <label class="form-label" for="profile-street">Street Address</label>
            <input type="text" class="form-input" id="profile-street" placeholder="Flat No, Building, Street">
          </div>
          <div class="form-grid-2">
            <div class="form-group">
              <label class="form-label" for="profile-city">City</label>
              <input type="text" class="form-input" id="profile-city" placeholder="e.g. Noida">
            </div>
            <div class="form-group">
              <label class="form-label" for="profile-state">State</label>
              <input type="text" class="form-input" id="profile-state" placeholder="e.g. Uttar Pradesh">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="profile-pincode">Pincode</label>
            <input type="text" class="form-input" id="profile-pincode" placeholder="6 digit pin code" pattern="[0-9]{6}">
          </div>

          <button type="submit" class="btn btn-primary" style="margin-top:16px;">Save Changes</button>
        </form>
      </div>

      <!-- Change Password Panel -->
      <div style="background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:32px;">
        <h3 style="font-weight:700; margin-bottom:24px;">Change Password</h3>
        
        <form id="change-password-form">
          <div class="form-group">
            <label class="form-label" for="current-password">Current Password</label>
            <input type="password" class="form-input" id="current-password" required placeholder="Enter current password">
          </div>
          <div class="form-group">
            <label class="form-label" for="new-password">New Password</label>
            <input type="password" class="form-input" id="new-password" required placeholder="Min 6 characters">
          </div>
          <div class="form-group">
            <label class="form-label" for="confirm-new-password">Confirm New Password</label>
            <input type="password" class="form-input" id="confirm-new-password" required placeholder="Confirm new password">
          </div>

          <button type="submit" class="btn btn-teal" style="margin-top:16px;">Change Password</button>
        </form>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container footer-inner">
      <div class="footer-bottom" style="border:none; padding:0;">
        <p>&copy; 2026 DIGItal Duniya. All rights reserved.</p>
        <p>Your e-commerce personal dashboard.</p>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script type="module" src="js/profile.js"></script>
  <script type="module">
    import { toggleTheme } from './js/theme.js';
    import { setLang } from './js/language.js';
    import { logout } from './js/auth.js';
    import './js/search.js';

    document.getElementById('theme-toggle')?.addEventListener('click', toggleTheme);
    document.getElementById('lang-selector')?.addEventListener('change', (e) => {
      setLang(e.target.value);
    });

    const navToggle = document.getElementById('nav-toggle');
    const navMenu = document.getElementById('nav-menu');
    navToggle?.addEventListener('click', () => {
      navMenu?.classList.toggle('open');
    });

    document.getElementById('logout-btn')?.addEventListener('click', async (e) => {
      e.preventDefault();
      await logout();
    });
  </script>
</body>
</html>
